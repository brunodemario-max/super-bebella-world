<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12182b"><title>Super Bebella World V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12182b;font-family:monospace;touch-action:none}
canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#12182b;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:bold;padding:30px}
#rotate b{font-size:55px;display:block}.controls{position:fixed;inset:0;z-index:20;pointer-events:none}
.btn{pointer-events:auto;position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:76px;height:76px;border:3px solid #fff9;border-radius:22px;background:#15213dbb;color:#fff;font-size:34px;font-weight:bold;box-shadow:0 4px 0 #0005}
#L{left:max(20px,env(safe-area-inset-left))}#R{left:max(110px,calc(env(safe-area-inset-left) + 90px))}
#J{right:max(24px,env(safe-area-inset-right));width:92px;height:92px;border-radius:50%;background:#ed4f9ecc}
#sound{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));border:2px solid #fff8;border-radius:13px;background:#1119;color:#fff;font-size:22px;padding:8px 11px}
@media(orientation:portrait){#rotate{display:flex}.controls,#sound{display:none}}
</style></head><body>
<canvas id="g" width="960" height="540"></canvas>
<div id="rotate"><div><b>📱↻</b>Vire o celular para jogar<br>SUPER BEBELLA WORLD 🎀</div></div>
<button id="sound">🔊</button><div class="controls"><button class="btn" id="L">◀</button><button class="btn" id="R">▶</button><button class="btn" id="J">▲</button></div>
<script>
const C=document.getElementById('g'),X=C.getContext('2d');X.imageSmoothingEnabled=false;
const W=960,H=540,WORLD=7200;let k={L:0,R:0,J:0},score=0,lives=3,cam=0,state='intro',inv=90,checkpoint=90,soundOn=true,audio=null,musicTimer=null;
let p={x:90,y:400,w:30,h:48,vx:0,vy:0,on:0,face:1,step:0};
const plats=[[-100,470,720,90],[700,470,650,90],[1430,470,500,90],[2020,470,800,90],[2910,470,540,90],[3540,470,850,90],[4480,470,600,90],[5180,470,760,90],[6040,470,1250,90],
[320,380,150,20],[790,355,150,20],[1040,300,120,20],[1500,370,170,20],[1760,305,120,20],[2150,365,150,20],[2440,300,130,20],[3020,360,160,20],[3300,295,130,20],[3660,370,170,20],[3990,310,130,20],[4580,355,160,20],[4900,285,130,20],[5300,365,170,20],[5630,305,140,20],[6160,360,170,20],[6510,290,140,20]];
const coinP=[[370,340],[840,315],[1080,260],[1550,330],[1800,265],[2200,325],[2480,260],[3070,320],[3340,255],[3710,330],[4030,270],[4630,315],[4940,245],[5350,325],[5680,265],[6210,320],[6550,250],[6800,425]];
let coins=[],enemies=[],stars=[];
function objects(){coins=coinP.map(a=>({x:a[0],y:a[1],got:0}));stars=[{x:2740,y:420,got:0},{x:4350,y:420,got:0},{x:5900,y:420,got:0}];enemies=[
{x:760,y:436,min:720,max:1000,d:1,dead:0},{x:1200,y:436,min:1100,max:1320,d:-1,dead:0},{x:2070,y:436,min:2050,max:2400,d:1,dead:0},{x:3000,y:436,min:2960,max:3300,d:-1,dead:0},{x:3600,y:436,min:3580,max:4000,d:1,dead:0},{x:4550,y:436,min:4520,max:4850,d:-1,dead:0},{x:5250,y:436,min:5220,max:5600,d:1,dead:0},{x:6120,y:436,min:6080,max:6500,d:-1,dead:0}]}
objects();
function A(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function tone(f,d=.08,v=.04,type='square'){if(!soundOn)return;A();let o=audio.createOscillator(),q=audio.createGain();o.type=type;o.frequency.value=f;q.gain.value=v;o.connect(q);q.connect(audio.destination);o.start();q.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}
function music(){if(musicTimer)return;let notes=[262,330,392,523,392,330,294,349,440,587,440,349],i=0;musicTimer=setInterval(()=>{if(soundOn&&state==='play')tone(notes[i++%notes.length],.14,.018,'square')},180)}
function startAudio(){A();music()}
document.getElementById('sound').onclick=e=>{e.stopPropagation();soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊':'🔇';if(soundOn)startAudio()};
function btn(id,n){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();startAudio();k[n]=1;b.setPointerCapture?.(e.pointerId)};b.onpointerup=b.onpointercancel=e=>{e.preventDefault();k[n]=0}}btn('L','L');btn('R','R');btn('J','J');
onkeydown=e=>{if(e.key==='ArrowLeft')k.L=1;if(e.key==='ArrowRight')k.R=1;if(e.key==='ArrowUp'||e.key===' ')k.J=1};onkeyup=e=>{if(e.key==='ArrowLeft')k.L=0;if(e.key==='ArrowRight')k.R=0;if(e.key==='ArrowUp'||e.key===' ')k.J=0};
C.onpointerdown=()=>{startAudio();if(state==='intro')state='play';else if(state==='over'||state==='win')restart()};
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function spawn(){p.x=checkpoint;p.y=400;p.vx=p.vy=0;inv=100}
function lose(){if(inv||state!=='play')return;lives--;tone(110,.3,.06,'sawtooth');if(lives<=0){lives=0;state='over'}else spawn()}
function restart(){score=0;lives=3;cam=0;checkpoint=90;objects();spawn();state='play'}
function update(){
if(state!=='play')return;if(inv)inv--;
p.vx+=(k.R?0.8:0)-(k.L?0.8:0);p.vx*=.82;p.vx=Math.max(-6.4,Math.min(6.4,p.vx));if(Math.abs(p.vx)>.3)p.face=p.vx>0?1:-1;
if(k.J&&p.on){p.vy=-13;p.on=0;tone(420,.1,.035)}p.vy=Math.min(15,p.vy+.65);let oy=p.y;p.x+=p.vx;p.x=Math.max(0,Math.min(WORLD-30,p.x));p.y+=p.vy;p.on=0;p.step+=Math.abs(p.vx)*.08;
for(const q of plats){let b={x:q[0],y:q[1],w:q[2],h:q[3]};if(hit(p,b)&&oy+p.h<=b.y+8&&p.vy>=0){p.y=b.y-p.h;p.vy=0;p.on=1}}
if(p.y>620){lose();return}
for(const o of coins)if(!o.got&&Math.hypot(p.x+15-o.x,p.y+24-o.y)<32){o.got=1;score+=100;tone(880,.07,.035)}
for(const s of stars)if(!s.got&&Math.hypot(p.x+15-s.x,p.y+24-s.y)<35){s.got=1;score+=500;lives=Math.min(5,lives+1);tone(1047,.18,.05)}
for(const e of enemies){if(e.dead)continue;e.x+=e.d*1.15;if(e.x<e.min||e.x>e.max)e.d*=-1;let b={x:e.x,y:e.y,w:36,h:34};if(hit(p,b)){if(p.vy>2&&oy+p.h<=e.y+12){e.dead=1;p.vy=-8;score+=250;tone(180,.1,.05)}else{lose();return}}}
if(p.x>2300&&checkpoint<2300){checkpoint=2300;tone(660,.2,.04)}if(p.x>4500&&checkpoint<4500){checkpoint=4500;tone(660,.2,.04)}
if(p.x>7000){state='win';score+=1500;tone(523,.15,.05);setTimeout(()=>tone(659,.15,.05),150);setTimeout(()=>tone(784,.35,.05),300)}
cam=Math.max(0,Math.min(WORLD-W,p.x-330))}
function girl(px,py){
X.save();X.translate(Math.round(px-cam),Math.round(py));if(p.face<0){X.translate(30,0);X.scale(-1,1)}
let walk=p.on&&Math.abs(p.vx)>.4?Math.sin(p.step)*2:0;
// cabelo cacheado
X.fillStyle='#2d1a18';[[2,3],[8,0],[15,1],[22,3],[0,10],[25,10],[1,18],[24,18]].forEach(a=>X.fillRect(a[0],a[1],8,9));
X.fillStyle='#b97850';X.fillRect(7,8,18,20);
// tiara e laço
X.fillStyle='#f04f9e';X.fillRect(4,4,24,4);X.fillRect(22,0,6,7);X.fillRect(27,2,5,5);
// óculos claros
X.fillStyle='#e7f7ff';X.fillRect(5,11,10,7);X.fillRect(18,11,10,7);X.fillStyle='#9ad5e8';X.fillRect(14,13,5,2);
X.fillStyle='#24212a';X.fillRect(9,13,2,2);X.fillRect(22,13,2,2);X.fillStyle='#8f4d3d';X.fillRect(14,21,5,2);
// camiseta preta e detalhe rosa
X.fillStyle='#151515';X.fillRect(5,28,21,13);X.fillStyle='#f04f9e';X.fillRect(13,31,5,5);
// braços/pernas
X.fillStyle='#b97850';X.fillRect(2,29,4,11);X.fillRect(26,29,4,11);X.fillRect(8,41+walk,6,5);X.fillRect(18,41-walk,6,5);
X.fillStyle='#f04f9e';X.fillRect(6,45+walk,9,3);X.fillRect(17,45-walk,9,3);X.restore()}
function cloud(a,b){X.fillStyle='#fff';X.fillRect(a,b,90,18);X.fillRect(a+18,b-15,48,18)}
function star(x,y){X.save();X.translate(x-cam,y);X.fillStyle='#fff06a';X.font='bold 28px serif';X.fillText('★',-14,10);X.restore()}
function draw(){
let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#55bdff');g.addColorStop(1,'#e8f9ff');X.fillStyle=g;X.fillRect(0,0,W,H);
for(let i=0;i<16;i++)cloud(i*300-(cam*.16)%300,65+(i%3)*42);
X.fillStyle='#8bd36a';for(let i=0;i<10;i++){let a=i*430-cam*.4;X.beginPath();X.arc(a,470,160,Math.PI,0);X.fill()}
for(const q of plats){X.fillStyle='#54ad4b';X.fillRect(q[0]-cam,q[1],q[2],14);X.fillStyle='#8a5a35';X.fillRect(q[0]-cam,q[1]+14,q[2],q[3]-14)}
for(const o of coins)if(!o.got){X.fillStyle='#ffd21f';X.beginPath();X.arc(o.x-cam,o.y,10,0,7);X.fill()}
for(const s of stars)if(!s.got)star(s.x,s.y);
for(const e of enemies)if(!e.dead){X.fillStyle='#713a27';X.fillRect(e.x-cam,e.y,36,34);X.fillStyle='#fff';X.fillRect(e.x-cam+5,e.y+7,9,8);X.fillRect(e.x-cam+22,e.y+7,9,8);X.fillStyle='#222';X.fillRect(e.x-cam+9,e.y+10,3,3);X.fillRect(e.x-cam+24,e.y+10,3,3)}
// checkpoints
for(const cp of [2300,4500]){X.fillStyle='#eee';X.fillRect(cp-cam,390,6,80);X.fillStyle='#f04f9e';X.fillRect(cp+6-cam,395,55,28)}
// chegada + cachorro
X.fillStyle='#f7b733';X.fillRect(7030-cam,260,10,210);X.fillStyle='#f04f9e';X.fillRect(7040-cam,270,95,48);X.fillStyle='#fff';X.font='bold 15px monospace';X.fillText('BEBELLA!',7048-cam,299);
X.fillStyle='#eee';X.fillRect(6960-cam,428,34,30);X.fillStyle='#333';X.fillRect(6962-cam,423,10,12);X.fillRect(6982-cam,423,10,12);X.fillStyle='#111';X.fillRect(6974-cam,440,5,4);
if(!inv||Math.floor(inv/6)%2===0)girl(p.x,p.y);
X.fillStyle='#111b';X.fillRect(15,14,310,55);X.fillStyle='#fff';X.font='bold 20px monospace';X.fillText('⭐ '+score+'   ❤️ '+lives+'   🎀 '+stars.filter(s=>s.got).length+'/3',28,49);
X.textAlign='center';
if(state==='intro'){X.fillStyle='#111d';X.fillRect(150,120,660,280);X.fillStyle='#fff';X.font='bold 38px monospace';X.fillText('SUPER BEBELLA WORLD 🎀',480,190);X.font='bold 24px monospace';X.fillText('BEBELLA, SUA AVENTURA',480,250);X.fillText('COMEÇA AGORA!',480,282);X.font='18px monospace';X.fillText('Toque na tela para começar',480,345)}
if(state==='over'||state==='win'){X.fillStyle='#111d';X.fillRect(170,140,620,235);X.fillStyle='#fff';X.font='bold 40px monospace';X.fillText(state==='win'?'BEBELLA CONSEGUIU! 🎀🐶':'FIM DE JOGO',480,220);X.font='21px monospace';X.fillText(state==='win'?'Você encontrou seu amiguinho!':'Vamos tentar novamente?',480,270);X.fillText('Pontuação: '+score,480,310);X.font='17px monospace';X.fillText('Toque para jogar novamente',480,345)}
X.textAlign='left'}
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script></body></html>
