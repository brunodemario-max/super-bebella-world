<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Super Bebella World</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:monospace;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111827}
canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#63c5ff}
#rotate{display:none;position:fixed;inset:0;z-index:30;background:#111827;color:white;align-items:center;justify-content:center;text-align:center;padding:35px;font-size:22px;font-weight:bold}
#rotate span{font-size:54px;display:block;margin-bottom:18px}
.controls{position:fixed;inset:0;z-index:20;pointer-events:none}
.btn{pointer-events:auto;position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:78px;height:78px;border:3px solid #ffffff99;border-radius:22px;background:#172033aa;color:#fff;font-size:35px;font-weight:900;box-shadow:0 4px 0 #0005;user-select:none}
#left{left:max(20px,env(safe-area-inset-left))}
#right{left:max(112px,calc(env(safe-area-inset-left) + 92px))}
#jump{right:max(24px,env(safe-area-inset-right));width:92px;height:92px;border-radius:50%;background:#e83e8ccc}
@media (orientation:portrait){#rotate{display:flex}.controls{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="rotate"><div><span>📱↻</span>Vire o celular para jogar<br><small>Super Bebella World 🎀</small></div></div>
<div class="controls"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button><button class="btn" id="jump">▲</button></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=960,H=540,WORLD=3300;
let keys={L:false,R:false,J:false},score=0,lives=3,cam=0,state='play',inv=90;
const start={x:90,y:380};
let p={x:start.x,y:start.y,w:32,h:46,vx:0,vy:0,on:false};

const platforms=[
[-100,465,650,90],[610,465,430,90],[1100,465,560,90],[1720,465,680,90],[2470,465,900,90],
[330,375,150,22],[730,350,145,22],[950,290,125,22],[1260,365,160,22],[1510,305,125,22],
[1840,370,160,22],[2100,310,145,22],[2570,365,160,22],[2820,300,140,22]
];
const coinPos=[[385,335],[775,310],[995,250],[1320,325],[1550,265],[1900,330],[2150,270],[2630,325],[2870,260]];
let coins,enemies;
function newObjects(){
 coins=coinPos.map(a=>({x:a[0],y:a[1],got:false}));
 enemies=[
 {x:680,y:431,min:640,max:900,d:1,dead:false},
 {x:1190,y:431,min:1140,max:1500,d:-1,dead:false},
 {x:1800,y:431,min:1760,max:2150,d:1,dead:false},
 {x:2520,y:431,min:2500,max:2850,d:-1,dead:false}
 ];
}
newObjects();

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function respawn(){p.x=start.x;p.y=start.y;p.vx=0;p.vy=0;cam=0;inv=100}
function lose(){if(inv>0||state!=='play')return;lives--;if(lives<=0){lives=0;state='over';return}respawn()}
function restart(){score=0;lives=3;state='play';newObjects();respawn()}

function setButton(id,k){
 const b=document.getElementById(id);
 const down=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture?.(e.pointerId)};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);
 b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
}
setButton('left','L');setButton('right','R');setButton('jump','J');
addEventListener('keydown',e=>{
 if(['ArrowLeft','a','A'].includes(e.key))keys.L=true;
 if(['ArrowRight','d','D'].includes(e.key))keys.R=true;
 if(['ArrowUp','w','W',' '].includes(e.key))keys.J=true;
 if((state==='over'||state==='win')&&e.key==='Enter')restart();
});
addEventListener('keyup',e=>{
 if(['ArrowLeft','a','A'].includes(e.key))keys.L=false;
 if(['ArrowRight','d','D'].includes(e.key))keys.R=false;
 if(['ArrowUp','w','W',' '].includes(e.key))keys.J=false;
});
c.addEventListener('pointerdown',()=>{if(state!=='play')restart()});

function update(){
 if(state!=='play')return;
 if(inv>0)inv--;
 p.vx+=(keys.R?0.8:0)-(keys.L?0.8:0); p.vx*=0.82; p.vx=Math.max(-6.2,Math.min(6.2,p.vx));
 if(keys.J&&p.on){p.vy=-13;p.on=false}
 p.vy=Math.min(15,p.vy+0.65);
 let oldY=p.y;
 p.x+=p.vx;p.x=Math.max(0,Math.min(WORLD-p.w,p.x));
 p.y+=p.vy;p.on=false;
 for(const q of platforms){
  const b={x:q[0],y:q[1],w:q[2],h:q[3]};
  if(rect(p,b)&&oldY+p.h<=b.y+8&&p.vy>=0){p.y=b.y-p.h;p.vy=0;p.on=true}
 }
 if(p.y>H+100){lose();return}
 for(const o of coins)if(!o.got&&Math.hypot(p.x+p.w/2-o.x,p.y+p.h/2-o.y)<34){o.got=true;score+=100}
 for(const e of enemies){
  if(e.dead)continue;
  e.x+=e.d*1.15;if(e.x<=e.min){e.x=e.min;e.d=1}if(e.x>=e.max){e.x=e.max;e.d=-1}
  const b={x:e.x,y:e.y,w:36,h:34};
  if(rect(p,b)){
   if(p.vy>1.5&&oldY+p.h<=e.y+12){e.dead=true;p.vy=-8;score+=250}
   else {lose();return}
  }
 }
 if(p.x>3150){state='win';score+=1000}
 cam=Math.max(0,Math.min(WORLD-W,p.x-330));
}

function bella(px,py){
 ctx.save();ctx.translate(Math.round(px-cam),Math.round(py));
 if(p.vx<-.15){ctx.translate(p.w,0);ctx.scale(-1,1)}
 ctx.fillStyle='#3b2118';ctx.fillRect(2,2,29,27);ctx.fillRect(0,7,5,15);ctx.fillRect(27,5,5,17);
 ctx.fillStyle='#b97850';ctx.fillRect(7,8,20,19);
 ctx.fillStyle='#ef4f9b';ctx.fillRect(3,1,28,5);ctx.fillRect(23,-2,7,7);
 ctx.fillStyle='#dff5ff';ctx.fillRect(5,10,11,8);ctx.fillRect(19,10,11,8);
 ctx.fillStyle='#222';ctx.fillRect(10,13,3,3);ctx.fillRect(23,13,3,3);
 ctx.fillStyle='#111';ctx.fillRect(4,27,27,15);ctx.fillStyle='#ef4f9b';ctx.fillRect(3,42,12,4);ctx.fillRect(20,42,12,4);
 ctx.restore();
}
function cloud(x,y){ctx.fillStyle='#fff';ctx.fillRect(x,y,85,18);ctx.fillRect(x+18,y-14,45,18)}
function draw(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#58bdff');g.addColorStop(1,'#e5f8ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let i=0;i<14;i++)cloud(i*270-(cam*.18)%270,75+(i%3)*45);
 ctx.fillStyle='#8dd36c';for(let i=0;i<10;i++){let xx=i*430-cam*.45;ctx.beginPath();ctx.arc(xx,470,150,Math.PI,0);ctx.fill()}
 for(const q of platforms){ctx.fillStyle='#55ad4b';ctx.fillRect(q[0]-cam,q[1],q[2],14);ctx.fillStyle='#8a5a35';ctx.fillRect(q[0]-cam,q[1]+14,q[2],q[3]-14)}
 for(const o of coins)if(!o.got){ctx.fillStyle='#ffd21f';ctx.beginPath();ctx.arc(o.x-cam,o.y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff3';ctx.fillRect(o.x-cam-2,o.y-7,3,9)}
 for(const e of enemies)if(!e.dead){ctx.fillStyle='#743b25';ctx.fillRect(e.x-cam,e.y,36,34);ctx.fillStyle='#fff';ctx.fillRect(e.x-cam+5,e.y+7,9,8);ctx.fillRect(e.x-cam+22,e.y+7,9,8);ctx.fillStyle='#111';ctx.fillRect(e.x-cam+9,e.y+10,3,3);ctx.fillRect(e.x-cam+24,e.y+10,3,3)}
 ctx.fillStyle='#f7b733';ctx.fillRect(3165-cam,255,12,210);ctx.fillStyle='#ef4f9b';ctx.fillRect(3177-cam,265,100,52);ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.fillText('BEBELLA!',3184-cam,297);
 if(inv===0||Math.floor(inv/6)%2===0)bella(p.x,p.y);
 ctx.fillStyle='#111b';ctx.fillRect(16,16,260,54);ctx.fillStyle='#fff';ctx.font='bold 21px monospace';ctx.fillText('⭐ '+score+'    ❤️ '+lives,30,50);
 ctx.textAlign='center';
 if(state==='over'||state==='win'){
  ctx.fillStyle='#111d';ctx.fillRect(190,145,580,230);ctx.fillStyle='#fff';
  ctx.font='bold 42px monospace';ctx.fillText(state==='win'?'BEBELLA VENCEU! 🎀':'FIM DE JOGO',480,225);
  ctx.font='22px monospace';ctx.fillText(state==='win'?'Pontuação: '+score:'Tente outra vez!',480,275);
  ctx.font='18px monospace';ctx.fillText('Toque na tela para jogar novamente',480,325);
 }
 ctx.textAlign='left';
}
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body></html>
