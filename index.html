<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Super Bebella World</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101428;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}canvas{width:100vw;height:100vh;object-fit:contain;background:#6ec6ff;image-rendering:pixelated}.btn{position:fixed;bottom:22px;width:68px;height:68px;border:3px solid #fff8;border-radius:18px;background:#0006;color:#fff;font-size:32px;font-weight:bold;user-select:none}.l{left:20px}.r{left:100px}.j{right:25px;width:86px;background:#e83e8caa}#title{position:fixed;top:10px;left:0;right:0;text-align:center;text-shadow:3px 3px #8b2460;font-weight:bold;font-size:clamp(16px,4vw,30px);pointer-events:none}</style></head>
<body><canvas id="c" width="960" height="540"></canvas><div id="title">SUPER BEBELLA WORLD 🎀</div><button class="btn l">◀</button><button class="btn r">▶</button><button class="btn j">▲</button>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let key={},cam=0,score=0,lives=3,won=false,p={x:90,y:380,w:34,h:48,vx:0,vy:0,on:0};
const platforms=[[-100,460,650,80],[630,460,400,80],[1110,460,500,80],[1700,460,800,80],[350,370,140,22],[760,330,130,22],[980,270,110,22],[1280,360,150,22],[1530,300,110,22],[1870,350,150,22],[2150,280,130,22]];
let coins=[[390,330],[800,290],[1020,230],[1330,320],[1570,260],[1930,310],[2200,240]].map(a=>({x:a[0],y:a[1],got:0})),enemies=[{x:700,y:426,d:1},{x:1200,y:426,d:-1},{x:1810,y:426,d:1},{x:2050,y:426,d:-1}];
function bind(s,k){let e=document.querySelector(s);e.onpointerdown=a=>{a.preventDefault();key[k]=1};e.onpointerup=e.onpointercancel=a=>{a.preventDefault();key[k]=0}}bind('.l','L');bind('.r','R');bind('.j','J');onkeydown=e=>key[e.key]=1;onkeyup=e=>key[e.key]=0;
function reset(){p.x=90;p.y=380;p.vx=p.vy=0;cam=0}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){if(won)return;let L=key.L||key.ArrowLeft,R=key.R||key.ArrowRight,J=key.J||key.ArrowUp||key[' '];p.vx+=(R-L)*.75;p.vx*=.82;p.vx=Math.max(-6,Math.min(6,p.vx));if(J&&p.on){p.vy=-13;p.on=0}p.vy=Math.min(p.vy+.65,15);let oy=p.y;p.x+=p.vx;p.y+=p.vy;p.on=0;
for(let q of platforms){let b={x:q[0],y:q[1],w:q[2],h:q[3]};if(hit(p,b)&&oy+p.h<=b.y+8&&p.vy>=0){p.y=b.y-p.h;p.vy=0;p.on=1}}if(p.y>600){lives--;reset()}
for(let o of coins)if(!o.got&&Math.hypot(p.x+17-o.x,p.y+24-o.y)<38){o.got=1;score+=100}
for(let e of enemies){e.x+=e.d*1.2;if(e.x%260<2)e.d*=-1;let b={x:e.x,y:e.y,w:36,h:34};if(hit(p,b)){if(p.vy>2&&p.y+35<e.y+15){e.dead=1;p.vy=-8;score+=250}else{lives--;reset()}}}enemies=enemies.filter(e=>!e.dead);if(p.x>2360){won=true;score+=1000}cam=Math.max(0,Math.min(1550,p.x-300))}
function bella(px,py){x.save();x.translate(px-cam,py);if(p.vx<-.2){x.translate(34,0);x.scale(-1,1)}x.fillStyle='#3b2118';x.fillRect(3,3,29,27);x.fillStyle='#b97850';x.fillRect(8,8,20,19);x.fillStyle='#e83e8c';x.fillRect(4,1,28,5);x.fillStyle='#d7efff';x.fillRect(6,10,11,8);x.fillRect(20,10,11,8);x.fillStyle='#222';x.fillRect(11,13,3,3);x.fillRect(24,13,3,3);x.fillStyle='#111';x.fillRect(5,27,28,17);x.fillStyle='#e83e8c';x.fillRect(3,43,13,5);x.fillRect(21,43,13,5);x.restore()}
function draw(){x.clearRect(0,0,960,540);let g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#55b9ff');g.addColorStop(1,'#dff7ff');x.fillStyle=g;x.fillRect(0,0,960,540);x.fillStyle='#fff';for(let i=0;i<9;i++){let a=i*310-cam*.2;x.fillRect(a,80+i%3*45,90,18);x.fillRect(a+20,65+i%3*45,45,18)}
for(let q of platforms){x.fillStyle='#56a84f';x.fillRect(q[0]-cam,q[1],q[2],14);x.fillStyle='#8a5a35';x.fillRect(q[0]-cam,q[1]+14,q[2],q[3]-14)}
for(let o of coins)if(!o.got){x.fillStyle='#ffd21f';x.beginPath();x.arc(o.x-cam,o.y,11,0,7);x.fill()}for(let e of enemies){x.fillStyle='#743b25';x.fillRect(e.x-cam,e.y,36,34);x.fillStyle='#fff';x.fillRect(e.x-cam+6,e.y+7,8,8);x.fillRect(e.x-cam+22,e.y+7,8,8)}
x.fillStyle='#f7b733';x.fillRect(2370-cam,260,12,200);x.fillStyle='#ff4f9a';x.fillRect(2382-cam,270,90,50);x.fillStyle='#fff';x.font='bold 16px monospace';x.fillText('BEBELLA!',2388-cam,301);bella(p.x,p.y);x.fillStyle='#111a';x.fillRect(14,14,230,58);x.fillStyle='#fff';x.font='bold 21px monospace';x.fillText('⭐ '+score+'   ❤️ '+lives,28,50);
if(won){x.fillStyle='#111c';x.fillRect(190,150,580,210);x.fillStyle='#fff';x.textAlign='center';x.font='bold 40px monospace';x.fillText('BEBELLA VENCEU! 🎀',480,225);x.font='24px monospace';x.fillText('Pontuação: '+score,480,275);x.fillText('Recarregue para jogar novamente',480,320);x.textAlign='left'}}
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script></body></html>
